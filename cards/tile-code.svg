<svg xmlns="http://www.w3.org/2000/svg" width="260" height="160" viewBox="0 0 260 160">
  <defs>
    <style>
      @keyframes pop { from { transform: scale(0.9); opacity: 0; } to { transform: scale(1); opacity: 1; } }
      .bg { fill: #eff6ff; }
      .title { font-family: system-ui, sans-serif; font-size: 22px; font-weight: 700; fill: #1e40af; }
      .desc { font-family: system-ui, sans-serif; font-size: 13px; fill: #1e3a8a; }
    </style>
  </defs>
  <rect class="bg" width="260" height="160" rx="14" style="animation: pop 0.6s ease-out;"/>
  <text x="20" y="55" class="title">CODE</text>
  <text x="20" y="85" class="desc">Python · C/C++ · R</text>
  <text x="20" y="110" class="desc">SQL · Linux · Docker</text>
  <text x="20" y="135" class="desc">Building tools &amp; systems</text>
</svg>
